stages:
  - release
  - check
  - build
  - publish
  - maintenance

workflow:
  rules:
    # Run only when a new version tag is pushed, e.g. v0.8.0
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    # merge requests, so a release mr is verified before it is merged and tagged
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # pushes to the default branch, so a merged version bump gets tagged
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # nightly nix cache gc
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # manual pipeline run, for the maintenance jobs
    - if: '$CI_PIPELINE_SOURCE == "web"'

# the pinned nix image ships neither the experimental features nor NIX_CONFIG,
# so every `nix` invocation needs them enabled. set here rather than per job so
# a new nix-using job can't miss it; the alpine maintenance jobs ignore it
variables:
  NIX_CONFIG: 'experimental-features = nix-command flakes'

.nix-image: &nix-image nixos/nix:2.34.7@sha256:bf1d938835ab96312f098fa6c2e9cab367728e0aad0646ee3e02a787c80d8fb8

.release-only: &release-only
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# upload the built qcow2 + .sha256 into this pipeline's own staging dir on the
# deploy host, so an unfinished release cannot be published by a later one
.scp-images: &scp-images 'bash scripts/upload-images.sh'

.ssh-key-setup: &ssh-key-setup
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519

# manual; run a web pipeline on the default branch to open the next release mr.
# bumps the lockfile and every packaged tool, one commit each, bumps the
# version in flake.nix (patch unless RELEASE_BUMP=minor or major is set on the
# pipeline) and opens the merge request through git push options. the lockfile
# bump is held back when the new nixpkgs has uncached packages in the image;
# set RELEASE_LOCK=force or skip on the pipeline to override
#
# needs RELEASE_TOKEN: a project access token with the developer role and the
# write_repository scope, masked so git cannot leak it through the push url
prepare-release-mr:
  stage: release
  image: *nix-image
  tags:
    - x86-kvm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  variables:
    # the release branch is pushed from this checkout, so the shallow default
    # clone is not enough
    GIT_DEPTH: 0
  before_script:
    - test -n "${RELEASE_TOKEN:-}" || { echo "RELEASE_TOKEN is not set"; exit 1; }
  script:
    - bash scripts/release-mr.sh

# tags the version in flake.nix once it lands on the default branch, which
# starts the tag pipeline that builds and publishes the images. the tag goes on
# the commit that bumped the version, and nothing happens when that version is
# already tagged (tagged by hand, or a merge that did not bump it). set
# RELEASE_AUTO_TAG=false as a project variable to tag by hand instead
#
# needs RELEASE_TOKEN, because tags pushed with the job token do not start a
# pipeline. if v* tags are protected, the token's role must be allowed to
# create them
tag-release:
  stage: release
  image: *nix-image
  tags:
    - x86-kvm
  rules:
    - if: '$RELEASE_AUTO_TAG == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    # the tag goes on the commit that bumped the version, which can be older
    # than the pushed one when its own tag job failed
    GIT_DEPTH: 0
  before_script:
    - test -n "${RELEASE_TOKEN:-}" || { echo "RELEASE_TOKEN is not set"; exit 1; }
  script:
    - bash scripts/tag-release.sh

# what the tag pipeline would fail on, minus the image build itself: the image
# is evaluated (which forces the whole nixos and home-manager evaluation) and
# every package in it that cache.nixos.org cannot substitute is built, the
# packaged tools included, so a bump that breaks evaluation, carries a bad hash
# or pulls a package that no longer compiles surfaces on the merge request
# instead of after tagging. assembling the images is not reproduced here, so
# failures in that step are still only visible in the tag pipeline
.check-flake:
  stage: check
  image: *nix-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# the report lists the uncached packages the check built and which of them
# failed, linked from the merge request widget. expose_as takes no variables in
# its paths, so each job names its file literally
check-x86_64:
  extends: .check-flake
  tags:
    - x86-kvm
  script:
    - bash scripts/check.sh --arch x86_64 --report check-x86_64.txt
  artifacts:
    when: always
    expose_as: 'uncached packages x86_64'
    paths:
      - check-x86_64.txt

check-aarch64:
  extends: .check-flake
  tags:
    - arm-kvm
  script:
    - bash scripts/check.sh --arch aarch64 --report check-aarch64.txt
  artifacts:
    when: always
    expose_as: 'uncached packages aarch64'
    paths:
      - check-aarch64.txt

.build-image:
  stage: build
  image: *nix-image
  rules: *release-only
  before_script:
    # /dev/kvm is root:kvm 0660; the image-builder vm runs in nix's build
    # sandbox and can't open it, so qemu falls back to tcg and stalls
    - 'if [ -e /dev/kvm ]; then chmod 0666 /dev/kvm; fi'
    - |
      cat >> /etc/nix/nix.conf <<EOF
      system-features = kvm benchmark big-parallel nixos-test
      EOF
    # ssh key material for the scp deploy
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

build-headless-x86_64:
  extends: .build-image
  tags:
    - x86-kvm
  script:
    - bash scripts/build.sh --arch x86_64
    - *scp-images

build-headless-aarch64:
  extends: .build-image
  tags:
    - arm-kvm
  script:
    - bash scripts/build.sh --arch aarch64
    - *scp-images

# runs once every build job has succeeded, so a partial release is never served
# moves the uploaded images out of ~/inc into the served ~/http/iso. --expect
# is the number of build-* jobs above, one image each; keep it in step with them
publish-images:
  stage: publish
  image: *nix-image
  tags:
    - x86-kvm
  rules: *release-only
  before_script: *ssh-key-setup
  script:
    - scp -P ${SSH_PORT:-22} scripts/publish-images.sh "$SSH_DEPLOY_HOST:~/publish-images.sh"
    - ssh -p ${SSH_PORT:-22} "$SSH_DEPLOY_HOST" "bash ~/publish-images.sh --id '$CI_PIPELINE_ID' --tag '$CI_COMMIT_TAG' --expect 2"

# scheduled daily; deletes staging dirs of releases that never published, which
# nothing else collects. INC_RETENTION_DAYS keeps recent failures inspectable
inc-prune:
  stage: maintenance
  image: *nix-image
  tags:
    - x86-kvm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  before_script: *ssh-key-setup
  script:
    - scp -P ${SSH_PORT:-22} scripts/prune-inc.sh "$SSH_DEPLOY_HOST:~/prune-inc.sh"
    - ssh -p ${SSH_PORT:-22} "$SSH_DEPLOY_HOST" "bash ~/prune-inc.sh --days '${INC_RETENTION_DAYS:-7}'"

# emptying the volume is the only safe way to reclaim the runner's persistent
# nix cache: nothing in the ci store is gcrooted, so nix-collect-garbage also
# deletes the paths the nix image itself runs from and the volume stops booting.
# docker re-seeds an empty volume on the next job. alpine is used because its
# binaries do not live in /nix
.nix-cache-clean:
  stage: maintenance
  image: alpine:3.20
  tags:
    - arm-kvm

# scheduled daily; only reclaims once the backing disk crosses the threshold so
# the cache stays warm on normal days
nix-cache-gc:
  extends: .nix-cache-clean
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  script:
    - |
      threshold="${GC_THRESHOLD_PERCENT:-80}"
      used="$(df -P /nix | awk 'NR==2 {print $5}' | tr -dc '0-9')"
      echo "nix cache disk usage: ${used}% (threshold ${threshold}%)"
      if [ "${used:-0}" -ge "$threshold" ]; then
        find /nix -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        echo "cache emptied, docker re-seeds it on the next job"
      else
        echo "below threshold, keeping cache warm"
      fi

# unconditional wipe, e.g. after bumping the pinned nix image
nix-cache-reset:
  extends: .nix-cache-clean
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  script:
    - |
      find /nix -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      echo "entries left in /nix: $(ls -A /nix | wc -l)"
