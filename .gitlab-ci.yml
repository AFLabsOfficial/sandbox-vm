stages:
  - release
  - check
  - build
  - publish
  - maintenance

workflow:
  rules:
    # Run only when a new version tag is pushed, e.g. v0.8.0
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    # merge requests, so a release mr is verified before it is merged and tagged
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # nightly nix cache gc
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # manual pipeline run, for the maintenance jobs
    - if: '$CI_PIPELINE_SOURCE == "web"'

# the pinned nix image ships neither the experimental features nor NIX_CONFIG,
# so every `nix` invocation needs them enabled. set here rather than per job so
# a new nix-using job can't miss it; the alpine maintenance jobs ignore it
variables:
  NIX_CONFIG: 'experimental-features = nix-command flakes'

.nix-image: &nix-image nixos/nix:2.34.7@sha256:bf1d938835ab96312f098fa6c2e9cab367728e0aad0646ee3e02a787c80d8fb8

.release-only: &release-only
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# upload the built qcow2 + .sha256 into this pipeline's own staging dir on the
# deploy host, so an unfinished release cannot be published by a later one
.scp-images: &scp-images 'bash scripts/upload-images.sh'

.ssh-key-setup: &ssh-key-setup
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519

# manual; run a web pipeline on the default branch to open the next release mr.
# bumps the lockfile and every packaged tool, one commit each, bumps the patch
# version in flake.nix and opens the merge request through git push options.
#
# needs RELEASE_TOKEN: a project access token with the developer role and the
# write_repository scope, masked so git cannot leak it through the push url
prepare-release-mr:
  stage: release
  image: *nix-image
  tags:
    - x86-kvm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  variables:
    # the release branch is pushed from this checkout, so the shallow default
    # clone is not enough
    GIT_DEPTH: 0
  before_script:
    - test -n "${RELEASE_TOKEN:-}" || { echo "RELEASE_TOKEN is not set"; exit 1; }
  script:
    - bash scripts/release-mr.sh

# what the tag pipeline would fail on, minus the image build itself: both image
# derivations are instantiated (which forces the whole nixos and home-manager
# evaluation) and the packaged tools are built, so a bump that breaks evaluation
# or carries a bad hash surfaces on the merge request instead of after tagging.
# assembling the images is not reproduced here, so failures in that step are
# still only visible in the tag pipeline
.check-flake:
  stage: check
  image: *nix-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

check-x86_64:
  extends: .check-flake
  tags:
    - x86-kvm
  script:
    - bash scripts/check.sh --arch x86_64

check-aarch64:
  extends: .check-flake
  tags:
    - arm-kvm
  script:
    - bash scripts/check.sh --arch aarch64

.build-image:
  stage: build
  image: *nix-image
  rules: *release-only
  before_script:
    # /dev/kvm is root:kvm 0660; the image-builder vm runs in nix's build
    # sandbox and can't open it, so qemu falls back to tcg and stalls
    - 'if [ -e /dev/kvm ]; then chmod 0666 /dev/kvm; fi'
    - |
      cat >> /etc/nix/nix.conf <<EOF
      system-features = kvm benchmark big-parallel nixos-test
      EOF
    # ssh key material for the scp deploy
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

build-headless-x86_64:
  extends: .build-image
  tags:
    - x86-kvm
  script:
    - bash scripts/build.sh --headless --arch x86_64
    - *scp-images

build-gui-x86_64:
  extends: .build-image
  tags:
    - x86-kvm
  script:
    - bash scripts/build.sh --gui --arch x86_64
    - *scp-images

build-headless-aarch64:
  extends: .build-image
  tags:
    - arm-kvm
  script:
    - bash scripts/build.sh --headless --arch aarch64
    - *scp-images

build-gui-aarch64:
  extends: .build-image
  tags:
    - arm-kvm
  script:
    - bash scripts/build.sh --gui --arch aarch64
    - *scp-images

# runs once every build job has succeeded, so a partial release is never served
# moves the uploaded images out of ~/inc into the served ~/http/iso
publish-images:
  stage: publish
  image: *nix-image
  tags:
    - x86-kvm
  rules: *release-only
  before_script: *ssh-key-setup
  script:
    - scp -P ${SSH_PORT:-22} scripts/publish-images.sh "$SSH_DEPLOY_HOST:~/publish-images.sh"
    - ssh -p ${SSH_PORT:-22} "$SSH_DEPLOY_HOST" "bash ~/publish-images.sh --id '$CI_PIPELINE_ID' --tag '$CI_COMMIT_TAG'"

# scheduled daily; deletes staging dirs of releases that never published, which
# nothing else collects. INC_RETENTION_DAYS keeps recent failures inspectable
inc-prune:
  stage: maintenance
  image: *nix-image
  tags:
    - x86-kvm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  before_script: *ssh-key-setup
  script:
    - scp -P ${SSH_PORT:-22} scripts/prune-inc.sh "$SSH_DEPLOY_HOST:~/prune-inc.sh"
    - ssh -p ${SSH_PORT:-22} "$SSH_DEPLOY_HOST" "bash ~/prune-inc.sh --days '${INC_RETENTION_DAYS:-7}'"

# emptying the volume is the only safe way to reclaim the runner's persistent
# nix cache: nothing in the ci store is gcrooted, so nix-collect-garbage also
# deletes the paths the nix image itself runs from and the volume stops booting.
# docker re-seeds an empty volume on the next job. alpine is used because its
# binaries do not live in /nix
.nix-cache-clean:
  stage: maintenance
  image: alpine:3.20
  tags:
    - arm-kvm

# scheduled daily; only reclaims once the backing disk crosses the threshold so
# the cache stays warm on normal days
nix-cache-gc:
  extends: .nix-cache-clean
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  script:
    - |
      threshold="${GC_THRESHOLD_PERCENT:-80}"
      used="$(df -P /nix | awk 'NR==2 {print $5}' | tr -dc '0-9')"
      echo "nix cache disk usage: ${used}% (threshold ${threshold}%)"
      if [ "${used:-0}" -ge "$threshold" ]; then
        find /nix -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        echo "cache emptied, docker re-seeds it on the next job"
      else
        echo "below threshold, keeping cache warm"
      fi

# unconditional wipe, e.g. after bumping the pinned nix image
nix-cache-reset:
  extends: .nix-cache-clean
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  script:
    - |
      find /nix -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      echo "entries left in /nix: $(ls -A /nix | wc -l)"
